<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found</title>
<style>
  :root { --bg: #F5F6F3; --ink: #16232C; --ink-soft: #52616B; --accent: #6E5424; }

    :root { --bg: #10171B; --ink: #E7ECE9; --ink-soft: #AEBAB5; --accent: #E0BC7C; }
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 1rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
  p { color: var(--ink-soft); margin: 0 0 1rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
